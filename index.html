<style>
:root{--bg:#f4f6fa;--surface:#fff;--ink:#14213d;--muted:#667085;--line:#e3e8f0;--accent:#1f4fd8;--accent-ink:#fff;--accent-soft:#e8eefc;

--side:#080e1b;--side-ink:#e6ecf8;--side-mute:#8fa0bf;--warn:#f0b35a;--warn-soft:#3a2c12;--bad:#ff8f84;--bad-soft:#3d1f1c;--ok:#7fd49a;--ok-soft:#173523;--toast-bg:#e6ecf8;--toast-ink:#0d1424;--code-bg:#080e1b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1424;--surface:#141d31;--ink:#e6ecf8;--muted:#9aa8c4;--line:#26324d;--accent:#7ea2ff;--accent-ink:#0b1430;--accent-soft:#1c2a4d;
--side:#080e1b;--side-ink:#e6ecf8;--side-mute:#8fa0bf;--warn:#f0b35a;--warn-soft:#3a2c12;--bad:#ff8f84;--bad-soft:#3d1f1c;--ok:#7fd49a;--ok-soft:#173523;--toast-bg:#e6ecf8;--toast-ink:#0d1424;--code-bg:#080e1b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:14px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}

.sidefoot{margin-top:auto;font-size:11.5px;color:var(--side-mute);padding:10px 8px 0;line-height:1.6}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
.topbar .sp{flex:1}
.chipst{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted);white-space:nowrap}
.chipst.on{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
main{padding:22px max(20px,env(safe-area-inset-right,0px)) 60px 20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.pghead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pghead h2{font-family:var(--f-head);font-size:24px;margin:0}
.pgact{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.out{border-color:var(--accent);color:var(--accent);font-weight:700}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 11px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=date],input[type=number],input[type=search],input[type=tel],input[type=email],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical;line-height:1.6}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.grid{display:grid;gap:12px}
.alerts{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.alert{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.alert b{font-family:var(--f-head);font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.alert span{font-size:12px;color:var(--muted)}
.alert.hot{border-color:var(--bad);background:var(--bad-soft)}.alert.hot b{color:var(--bad)}
.alert.warm{border-color:var(--warn)}.alert.warm b{color:var(--warn)}
.alert.static{cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card2{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}

.panel>h3{padding:12px 14px 0}
.home{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}

.todo:first-of-type{border-top:0}

.todo .dt{font-size:13px;font-variant-numeric:tabular-nums}

.todo .tt small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line)}
.stat:last-child{border-bottom:0}.stat span{color:var(--muted)}.stat b{font-family:var(--f-head);font-size:18px;font-variant-numeric:tabular-nums}
.pipe{display:flex;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.pipe button{flex:1 0 98px;border:0;border-right:1px solid var(--line);background:none;padding:8px 10px;cursor:pointer;text-align:left}
.pipe button:last-child{border-right:0}
.pipe button[aria-pressed=true]{background:var(--accent-soft)}
.pipe b{display:block;font-size:19px;font-family:var(--f-head);font-variant-numeric:tabular-nums}
.pipe span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input[type=search]{flex:1 1 220px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:820px}
th{font-size:11.5px;color:var(--muted);text-align:left;font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}tbody tr.row:hover{background:var(--accent-soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nw{white-space:nowrap}.site{font-weight:700}.sub{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--line)}
.pill.s0,.pill.s1{background:var(--warn-soft);color:var(--warn)}
.pill.s2,.pill.s3,.pill.s4{background:var(--accent-soft);color:var(--accent)}
.pill.s5,.pill.s6,.pill.s7{background:var(--ok-soft);color:var(--ok)}
.pill.s8{background:var(--line);color:var(--muted)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--muted);white-space:nowrap}
.tag.rv{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.tag.kq{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}.tag.ko{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.tag.ug{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.late{color:var(--bad);font-weight:700}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:14px;color:var(--muted);text-align:center;cursor:pointer;font-size:13px}
.drop.on,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row2 .sp{flex:1}
.res{display:flex;flex-direction:column;gap:10px}
.rc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.rc.ok{border-color:var(--ok);background:var(--ok-soft)}.rc.warn{border-color:var(--warn);background:var(--warn-soft)}
.rc .b{flex:1;min-width:220px}
pre.code{background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:12px 14px;overflow:auto;font-size:12px;line-height:1.55;max-height:300px;margin:8px 0}
.mask{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:80;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:16px 12px 24px}
.dlg{background:var(--surface);border-radius:14px;width:min(900px,100%);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-family:var(--f-head);margin:0;font-size:18px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.fields label.wide{grid-column:1/-1}
.fields input,.fields select,.fields textarea{color:var(--ink);font-size:14px;width:100%}
.fields label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.fields label.chk input{width:auto}
.items{min-width:0}
.items td{padding:4px 4px}.items th{padding:4px}
.items input{width:100%}.items .q{width:76px;text-align:right}.items .u{width:64px}.items .p{width:96px;text-align:right}
.items td.amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.sum{display:flex;gap:18px;justify-content:flex-end;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.sum b{font-family:var(--f-head);font-size:18px}
.acts{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.hist{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
details summary{cursor:pointer;font-weight:700;font-size:13px}
.mailbody{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px;max-height:260px;overflow:auto;margin-top:6px}
.issues{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px}
.issues ul{margin:4px 0 0 18px;padding:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--toast-bg);color:var(--toast-ink);padding:8px 16px;border-radius:8px;z-index:99;font-size:13px;max-width:90vw}
.login{position:fixed;inset:0;z-index:99;background:var(--side);display:flex;align-items:center;justify-content:center}
.login form{background:var(--surface);border-radius:12px;padding:28px 26px;width:min(340px,92vw);box-shadow:0 8px 30px #0006;display:flex;flex-direction:column;gap:10px}
.login h1{font-family:var(--f-head);font-size:19px;color:var(--accent);margin:0}
.login input{width:100%;font-size:16px;padding:10px}
.bnav{display:none}
@media(max-width:900px){.home{grid-template-columns:minmax(0,1fr)}}
@media(max-width:720px){
 .app{grid-template-columns:minmax(0,1fr)}.side{display:none}
 body{font-size:15px}main{padding:14px max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px))}
 .topbar{padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
 input[type=text],input[type=date],input[type=number],input[type=search],input[type=tel],input[type=email],input[type=password],select,textarea{font-size:16px;min-height:42px}
 .btn{min-height:40px}.btn.sm{min-height:34px}
 .alerts{grid-template-columns:repeat(2,minmax(0,1fr))}
 .todo{grid-template-columns:78px minmax(0,1fr)}.todo .go{display:none}
 .panel.scroll:has(>table.rt){overflow:visible;border:0;background:none}
 table.rt{min-width:0;display:block}table.rt thead{display:none}table.rt tbody{display:block}
 table.rt tr{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
 table.rt td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border:0;padding:3px 0;text-align:right}
 table.rt td::before{content:attr(data-l);color:var(--muted);font-size:12px;flex:none;text-align:left}
 table.rt td.rt0{order:-1;display:block;text-align:left;font-size:15px;padding:0 0 6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
 table.rt td.rt0::before{display:none}
 .mask{padding:0}.dlg{border-radius:0;min-height:100%;padding:14px}
 .items{min-width:560px}
 .bnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
 .bnav button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10.5px;color:var(--muted);cursor:pointer;border-radius:10px;min-height:52px}
 .bnav button[aria-current=page]{color:var(--accent);font-weight:700;background:var(--accent-soft)}
 .bnav .n{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;line-height:17px;text-align:center;padding:0 4px}
}
.gml{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;margin-top:10px;max-height:340px;overflow:auto}
.gml label{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.gml label:last-child{border-bottom:0}.gml label.done{opacity:.55;cursor:default}
.gml .s{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gml .f{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnav{padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
</style></head>
<body>
<div class="app">
 <aside class="side" id="side"></aside>
 <div class="mainwrap">
  <div class="topbar"><b id="ttl" style="font-family:var(--f-head);font-size:16px"></b><span class="sp"></span><span id="modechip"></span></div>
  <main id="main"></main>
 </div>
</div>

<script src="parse.js"></script>
<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var ST=AP.STATUS;
var ICONS={home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 mail:'<path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M3 7l9 6 9-6"/>',
 bld:'<path d="M4 21V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v17M15 9h4a1 1 0 0 1 1 1v11M2 21h20M8 7h3M8 11h3M8 15h3"/>',
 set:'<path d="M4 6h8M16 6h4M4 12h2M10 12h10M4 18h10M18 18h2"/><circle cx="14" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/>'};
function ic(n){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+ICONS[n]+'</svg>'}
function e(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function yen(n){return n==null?"—":"¥"+Math.round(n).toLocaleString("ja-JP")}
function md(d){d=AP.dateOnly(d);return d?(+d.slice(5,7))+"/"+(+d.slice(8,10)):"—"}
function ymdj(d){d=AP.dateOnly(d);return d?d.slice(0,4)+"/"+d.slice(5,7)+"/"+d.slice(8,10):"—"}
function today(){return AP.todayJst()}
function daysTo(d){if(!d)return null;var a=Date.parse(d+"T00:00:00Z"),b=Date.parse(today()+"T00:00:00Z");return Math.round((a-b)/864e5)}
function rid(){return "o"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var SRC={paste:"貼り付け",gmail:"Gmail",manual:"手入力",mail:"メール",pdf:"作業依頼書PDF"};

var S={tab:"home",orders:[],mails:[],settings:{staff:[],own:[]},f:{status:"",q:"",staff:"",sp:"",kind:""},ver:{},flags:{ai:false,inbound:false},mode:"local",dlg:null,eml:null,busy:false,queue:[]};

/* ================= データ層 ================= */
var LS="ap:v1";
function lsGet(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(x){return {}}}
function lsSet(d){try{localStorage.setItem(LS,JSON.stringify(d))}catch(x){toast("保存できませんでした(ブラウザの保存容量)")}}
function vals(o){return Object.keys(o||{}).map(function(k){return o[k]})}
function buildMail(p){
  var m={from:String(p.from||""),subject:String(p.subject||""),date:String(p.date||""),messageId:String(p.messageId||""),body:String(p.text||"")};
  if(!m.from&&!m.subject){var s=AP.sniffHeaders(m.body);m.from=s.from;m.subject=s.subject;m.date=s.date||m.date;m.body=s.body}
  if(m.date&&!/^\d{4}-\d{2}-\d{2}T/.test(m.date))m.date=AP.parseDate(m.date)||"";
  return m;
}
var Local={
 mode:"local",
 async load(){var d=lsGet();return {orders:vals(d.orders),mails:vals(d.mails),settings:d.settings||{}}},
 async saveOrder(j){var d=lsGet();d.orders=d.orders||{};d.orders[j.id]=j;lsSet(d)},
 async delOrder(id){var d=lsGet();if(d.orders)delete d.orders[id];lsSet(d)},
 async saveMail(m){var d=lsGet();d.mails=d.mails||{};d.mails[m.key]=m;lsSet(d)},
 async saveSettings(s){var d=lsGet();d.settings=s;lsSet(d)},
 async nextNo(){var d=lsGet(),day=today();d.seq=d.seq||{};d.seq[day]=(d.seq[day]||0)+1;lsSet(d);return AP.orderNo(day,d.seq[day])},
 async ver(){return null},
 async ingest(p){
  var mail=buildMail(p),d=lsGet(),key=AP.mailKey(mail),now=new Date().toISOString();
  d.mails=d.mails||{};
  if(!p.dryRun&&d.mails[key]&&!p.force)return {state:"duplicate",jobs:d.mails[key].jobs||[],key:key};
  var own=d.settings&&d.settings.own&&d.settings.own.length?d.settings.own:AP.OWN_DEFAULT;

var LIB={pdf:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",pdfw:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",zip:"https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.62/dist/zip-full.min.js"};
function zpwGet(){try{return localStorage.getItem("ap:zpw")||""}catch(x){return ""}}
function zpwSet(v){try{if(v)localStorage.setItem("ap:zpw",v);else localStorage.removeItem("ap:zpw")}catch(x){}}
function loadScript(src){return new Promise(function(res,rej){var sc=document.createElement("script");sc.src=src;sc.onload=res;sc.onerror=function(){rej(new Error("読み込みに失敗しました: "+src.split("/").pop()))};document.head.appendChild(sc)})}
var libsP=null;
function libs(){
 if(!libsP)libsP=(async function(){
  await loadScript(LIB.pdf);await loadScript(LIB.pdfw);await loadScript(LIB.zip);
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=LIB.pdfw;
  window.zip.configure({useWebWorkers:false});
 })().catch(function(x){libsP=null;throw x});
 return libsP;
}
// PDF → 行ごとの文字(同じ高さの文字を1行に、離れたセルはタブ区切り)
async function pdfDoc(blob){return await window.pdfjsLib.getDocument({data:new Uint8Array(await blob.arrayBuffer()),isEvalSupported:false}).promise}
async function pdfText(doc){
 var out=[];
 for(var p=1;p<=doc.numPages;p++){
  var pg=await doc.getPage(p),tc=await pg.getTextContent(),rows=[];
  tc.items.filter(function(i){return i.str&&i.str.trim()}).forEach(function(i){var y=i.transform[5],r=null;for(var k=0;k<rows.length;k++)if(Math.abs(rows[k].y-y)<3){r=rows[k];break}if(!r){r={y:y,it:[]};rows.push(r)}r.it.push({s:i.str,x:i.transform[4],w:i.width})});
  rows.sort(function(a,b){return b.y-a.y});
  rows.forEach(function(r){r.it.sort(function(a,b){return a.x-b.x});var line="",end=null;r.it.forEach(function(i){if(end!=null&&i.x-end>6)line+="\t";line+=i.s;end=i.x+i.w});out.push(line)});
  out.push("");
 }
 return out.join("\n");
}
async function pdfImage(doc){
 var pg=await doc.getPage(1),vp=pg.getViewport({scale:2}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
 await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
 return await new Promise(function(r){c.toBlob(r,"image/png")});
}
// ZIP を開いて PDF を取り出す(パスワード付き・入れ子のZIP・日本語ファイル名に対応)
async function unzipPdfs(blob,pw,depth){
 var rd=new window.zip.ZipReader(new window.zip.BlobReader(blob),{password:pw||undefined}),out=[];
 try{
  var ents=await rd.getEntries({filenameEncoding:"shift_jis"});
  for(var i=0;i<ents.length;i++){
   var en=ents[i];if(en.directory)continue;
   var nm=en.filename.split("/").pop();
   if(/^\._|^__MACOSX/.test(en.filename))continue;
   if(/\.pdf$/i.test(nm))out.push({name:nm,blob:await en.getData(new window.zip.BlobWriter("application/pdf"),{password:pw||undefined})});
   else if(/\.zip$/i.test(nm)&&(depth||0)<2)out=out.concat(await unzipPdfs(await en.getData(new window.zip.BlobWriter("application/zip"),{password:pw||undefined}),pw,(depth||0)+1));
  }
 }finally{try{await rd.close()}catch(x){}}
 return out;
}
/* ZIPのパスワードを Gmail から探す: 添付メール(ファイル名で検索)→同じ差出人の前後1通→本文の候補を実際に試す */

function gday(ms){var d=new Date(ms+9*36e5);return d.getUTCFullYear()+"/"+(d.getUTCMonth()+1)+"/"+d.getUTCDate()}
async function gmFind(q,n){var p=await gmP("search_threads",{query:q,pageSize:n||20}),out=[];(p.threads||[]).forEach(function(t){(t.messages||[]).forEach(function(m){if(m&&m.id)out.push(m)})});return out}
async function gmMeta(id){var p=await gmP("get_message",{messageId:id,messageFormat:"MINIMAL"});return {id:id,t:Number(p.internalDate)||Date.parse(p.date||"")||0,sender:p.sender||"",subject:p.subject||"",snippet:p.snippet||""}}
async function gmBody(id){var p=await gmP("get_message",{messageId:id,messageFormat:"PLAIN_TEXT"});return {subject:p.subject||"",text:(p.subject||"")+"\n"+(p.plaintextBody||p.plaintext_body||p.plainTextBody||p.body||p.snippet||"")}}

async function findZipPassword(file,status){
 if(!CAP.mcp)return null;
 var tried={},name=file.name,base=name.replace(/\s*\(\d+\)(?=\.zip$)/i,"");
 async function tryMail(id,why){
  var b=await gmBody(id),c=AP.extractPasswords(b.text);
  for(var i=0;i<c.length;i++){if(tried[c[i]])continue;tried[c[i]]=1;if(await zipOk(file,c[i]))return {pw:c[i],subject:b.subject,why:why}}
  return null;
 }
 status("Gmailで添付メールを探しています…");
 var att=await gmFind('filename:"'+base+'"',10);
 if(!att.length&&base!==name)att=await gmFind('filename:"'+name+'"',10);
 var seen={};
 for(var a=0;a<att.length&&a<3;a++){
  var am=await gmMeta(att[a].id);if(!am.t)continue;
  var from=AP.parseFrom(am.sender).email||am.sender;
  status("前後のメールからパスワードを探しています…");
  var near=await gmFind((from?"from:"+from+" ":"")+"after:"+gday(am.t-864e5)+" before:"+gday(am.t+2*864e5),30);
  var metas=[];for(var i=0;i<near.length;i++){if(seen[near[i].id])continue;seen[near[i].id]=1;metas.push(near[i].id===am.id?am:await gmMeta(near[i].id))}
  if(!metas.some(function(m){return m.id===am.id}))metas.push(am);
  metas.sort(function(x,y){return x.t-y.t});
  var k=metas.findIndex(function(m){return m.id===am.id}),order=[];
  if(k>=0){if(metas[k+1])order.push([metas[k+1],"直後のメール"]);if(metas[k-1])order.push([metas[k-1],"直前のメール"])}
  metas.forEach(function(m){if(m.id!==am.id&&/パスワード|password|PW|解凍/i.test(m.subject+" "+m.snippet)&&!order.some(function(o){return o[0].id===m.id}))order.push([m,"同じ時間帯のパスワード通知"])});
  for(var j=0;j<order.length;j++){var r=await tryMail(order[j][0].id,order[j][1]);if(r)return r}
 }
 // 添付メールが見つからないとき: 最近のパスワード通知メールを順に試す
 status("最近のパスワード通知メールを確認しています…");
 var pwm=await gmFind("(パスワード OR password OR 解凍) newer_than:14d",15);
 for(var q=0;q<pwm.length&&q<15;q++){var r2=await tryMail(pwm[q].id,"最近のパスワード通知");if(r2)return r2}
 return null;
}
function zipErr(x){var m=String(x&&x.message||x);if(/password|encrypted/i.test(m))return /invalid/i.test(m)?"ZIPのパスワードが違います":"このZIPはパスワード付きです。パスワードを入れてからもう一度ドロップしてください";return m}
async function workFromPdf(name,blob){

 if(AP.isWorkOrder(text))return {w:AP.parseWorkOrder(text),ai:false};
 if(!CAP.sample)throw new Error("作業依頼書の書式ではないため読み取れませんでした(AIの読み取りが使えない状態です)");
 var raw;
 if(text.replace(/\s/g,"").length>80)raw=await CAP.sample.json(AP.buildWorkPrompt(text,false),{modelTier:"default"});
 else{var img=await pdfImage(doc);raw=await CAP.sample.json(AP.buildWorkPrompt("",true),{modelTier:"default",images:[img]})}
 return {w:AP.normalizeWork(raw),ai:true};
}

 if(!CAP.mcp)return '<div class="sub">このページでGmailを使えません。メールは上の欄に貼り付けて登録してください。</div>';
 var g=S.gm,h='<div class="sub" style="margin-bottom:8px">あなたのGmailから受注メールを探して、選んだものを読み取って登録します(読み取りのみ。メールは変更しません)。初回はGmailの利用許可を確認する画面が出ます。</div>'+
  '<div class="sub" style="margin-bottom:8px">※ 添付のZIPファイルはGmailから直接は読めません。添付付きのメールは、ZIPを保存して上の「作業依頼書を取り込む」にドロップしてください。</div>'+
  '<div class="tools"><input type="search" id="gmq" value="'+e(g.q||GM_Q)+'" aria-label="Gmailの検索条件"><button class="btn out" data-a="gmsearch"'+(g.busy?" disabled":"")+'>受信メールを探す</button></div>';
 if(g.msg)h+='<div class="sub" style="margin-top:8px">'+e(g.msg)+'</div>';
 if(g.list){
  if(!g.list.length)h+='<div class="empty" style="padding:14px">該当するメールはありません</div>';
  else{
   var nNew=g.list.filter(function(m){return !gmDone(m)}).length;
   h+='<div class="gml">'+g.list.map(function(m,i){var d=gmDone(m);return '<label class="'+(d?"done":"")+'"><input type="checkbox" class="gmc" data-i="'+i+'"'+(d?" disabled":" checked")+'><span style="min-width:0"><div class="s">'+e(m.subject||"(件名なし)")+'</div><div class="f">'+e(m.sender||"")+(m.snippet?" ／ "+e(m.snippet):"")+'</div></span><span>'+(d?'<span class="pill s8">取込済</span>':'<span class="pill s1">未取込</span>')+'</span></label>'}).join("")+'</div>'+
    '<div class="row2" style="margin-top:10px"><button class="btn pri" data-a="gmimport"'+(g.busy||!nNew?" disabled":"")+'>チェックしたメールを取り込む</button><span class="sub">未取込 '+nNew+' 件</span></div>';
  }
 }
 return h;
}
function gmDone(m){var k=AP.mailKey({messageId:m.id});return S.mails.some(function(x){return x.key===k&&x.state!=="processing"})}
function gmRender(){var c=$("#gmbox");if(c)c.innerHTML=gmBox()}
function gmErr(x){var c=x&&x.code;return c==="not_granted"?"Gmailの利用が許可されませんでした":c==="server_not_connected"||c==="not_connected"?"Gmailのコネクタが未接続です。claude.ai の設定 → コネクタ で Gmail を接続してください":c==="needs_reauth"?"Gmailの再接続が必要です(claude.ai の設定 → コネクタ)":"Gmailを読めませんでした("+(c||"エラー")+")"}
async function gmSearch(){
 var g=S.gm;g.q=($("#gmq")||{}).value||GM_Q;g.busy=true;g.msg="Gmailを検索しています…";gmRender();
 try{
  var r=await CAP.mcp.callTool("Gmail","search_threads",{query:g.q,pageSize:30},{cache:false});
  var th=(r.payload&&r.payload.threads)||[],out=[];
  th.forEach(function(t){(t.messages||[]).forEach(function(m){if(m&&m.id)out.push({id:m.id,subject:m.subject||"",sender:m.sender||"",snippet:m.snippet||"",date:m.date||""})})});
  g.list=out;g.msg=out.length?out.length+" 通見つかりました":"";
 }catch(x){g.list=null;g.msg=gmErr(x)}
 g.busy=false;gmRender();

async function gmImport(){
 var g=S.gm,picked=Array.prototype.filter.call(document.querySelectorAll(".gmc"),function(c){return c.checked&&!c.disabled}).map(function(c){return g.list[Number(c.dataset.i)]});
 if(!picked.length)return;
 g.busy=true;S.busy=true;var reg=0,skip=0,fail=0,res=[];
 for(var i=0;i<picked.length;i++){
  var m=picked[i];g.msg="読み取り中… "+(i+1)+" / "+picked.length+"(AI解析は1通あたり数十秒かかることがあります)";gmRender();
  try{
   var r=await CAP.mcp.callTool("Gmail","get_message",{messageId:m.id,messageFormat:"PLAIN_TEXT"},{cache:false}),p=r.payload||{};
   var body=p.plaintextBody||p.plaintext_body||p.plainTextBody||p.body||p.snippet||"";
   var out=await Store.ingest({text:String(body),from:p.sender||m.sender,subject:p.subject||m.subject,date:p.date||m.date||"",messageId:m.id,source:"gmail"});
   if(out.state==="registered"){reg+=out.jobs.length;res=res.concat(out.jobs)}else skip++;
   await reload(true);
  }catch(x){fail++;if(x&&x.code&&/not_granted|not_connected|needs_reauth/.test(x.code)){g.msg=gmErr(x);break}}
 }
 g.busy=false;S.busy=false;
 g.msg="登録 "+reg+" 件"+(skip?" ／ 対象外・取込済 "+skip+" 通":"")+(fail?" ／ 失敗 "+fail+" 通":"");
 gmRender();renderNav();renderLog();
 var box=$("#res");if(box&&res.length)box.innerHTML=res.map(function(j){return resCard("ok",'<b>登録しました: '+e(j.no)+'</b> '+kindTag(j)+flags(j)+'<div>'+e(j.customer||"(取引先不明)")+' ／ '+e(itemsText(j))+' ／ '+dueLine(j)+(j.amount!=null?' ／ '+yen(j.amount):'')+'</div>','<button class="btn sm" data-a="open" data-id="'+e(j.id)+'">開く・修正</button>')}).join("");
 toast("Gmailから "+reg+" 件登録しました");
}

function readRows(){

 }).filter(function(i){return i.name||i.qty!=null||i.price!=null});
}
function recalc(){

 Array.prototype.forEach.call(rows,function(tr){var q=$(".q",tr).value,p=$(".p",tr).value,c=$(".amt",tr);

  var r=await Store.ingest(p),box=$("#res");
  if(r.state==="registered"){
   box.innerHTML=r.jobs.map(function(j){return resCard("ok",'<b>登録しました: '+e(j.no)+'</b> '+kindTag(j)+flags(j)+'<div>'+e(j.customer||"(取引先不明)")+' ／ '+e(itemsText(j))+' ／ '+dueLine(j)+(j.amount!=null?' ／ '+yen(j.amount):'')+'</div>'+((j.issues||[]).filter(function(x){return x.indexOf("納期")<0}).length?'<div class="sub">要確認: '+e(j.issues.filter(function(x){return x.indexOf("納期")<0}).join(" / "))+'</div>':""),'<button class="btn sm" data-a="open" data-id="'+e(j.id)+'">開く・修正</button>')}).join("");
   ta.value="";S.eml=null;$("#emlinfo").textContent="";await reload();
  }else if(r.state==="draft"){
   S.queue=r.jobs.slice(1).map(function(j){return {job:j,key:r.key}});openJob(r.jobs[0],{draft:true,key:r.key});
  }else if(r.state==="duplicate"){
   box.innerHTML=resCard("warn",'<b>このメールはすでに取り込み済みです</b>'+((r.jobs||[]).length?'<div>'+e(r.jobs.map(function(j){return j.no}).join(", "))+'</div>':""),'<button class="btn sm" data-a="force">それでも登録する</button>');
  }else if(r.state==="skipped"){
   box.innerHTML=resCard("warn",'<b>見積依頼・注文のメールではないと判断したため、登録しませんでした</b><div class="sub">メルマガや案内などの可能性があります。見積依頼や注文の場合は「それでも登録する」を押してください。</div>','<button class="btn sm" data-a="force">それでも登録する</button>');
   await reload(true);
  }
 }catch(x){$("#res").innerHTML=resCard("warn","<b>読み取りに失敗しました</b><div class=\"sub\">"+e(x.message||x.code)+"</div>")}
 finally{btn.disabled=false;btn.textContent="解析して登録";S.busy=false}
}
function readFile(f){
 if(!f)return;
 var isEml=/\.eml$/i.test(f.name)||/rfc822/.test(f.type),fr=new FileReader();
 fr.onload=function(){
  if(isEml){
   var bin="",u=new Uint8Array(fr.result);for(var i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
   var m=AP.parseEml(bin);$("#mt").value=m.body.trim();S.eml={from:m.from,subject:m.subject,date:m.date,messageId:m.messageId};
   $("#emlinfo").textContent="読み込み: "+(m.subject||"(件名なし)")+" ／ "+(m.from||"");
  }else{$("#mt").value=String(fr.result);S.eml=null;$("#emlinfo").textContent="読み込み: "+f.name}
 };
 if(isEml)fr.readAsArrayBuffer(f);else fr.readAsText(f);
}
async function download(name,data,type){
 if(S.mode==="artifact"){if(!CAP.downloads){toast("このページではファイルを保存できません");return}try{await CAP.downloads.save({filename:name,data:new Blob([data],{type:type})})}catch(x){if(x&&x.code!=="cancelled")toast("保存できませんでした("+(x.code||"エラー")+")")}return}
var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function csvOut(){
 var L=filtered(),rows=[["案件No","種別","依頼日","状態","作業依頼番号","顧客案件番号","店舗","店舗コード","取引先","依頼元担当","電話","メール","作業名称・件名","作業内容","見積提出期限","作業予定日","作業日","希望納期","作業場所・納品先","担当","品名・作業項目","規格","数量","単位","単価(税抜)","金額(税抜)","備考"]];
 L.forEach(function(o){var its=o.items&&o.items.length?o.items:[{}];its.forEach(function(it){rows.push([o.no,o.kind==="work"?"作業依頼":o.kind==="order"?"注文":"見積依頼",AP.dateOnly(o.receivedAt||o.createdAt),ST[o.status],o.reqNo||"",o.caseNo||"",o.site||"",o.storeCode||"",o.customer,o.contact,o.tel,o.email,o.subject,o.detail||"",o.quoteDue||"",o.workDate||"",o.doneDate||"",o.deliveryDate,o.deliveryTo,o.staff,it.name||"",it.spec||"",it.qty==null?"":it.qty,it.unit||"",it.price==null?"":it.price,it.qty!=null&&it.price!=null?it.qty*it.price:"",o.note])})});
 var c=rows.map(function(r){return r.map(function(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(",")}).join("\r\n");
 download("案件一覧_"+today()+".csv","﻿"+c,"text/csv;charset=utf-8");
}

/* ================= イベント ================= */
document.addEventListener("click",async function(ev){
 var t=ev.target.closest("[data-a]");if(!t)return;
 var a=t.dataset.a;
 if(a==="delstaff"||a==="pick")ev.preventDefault();
 switch(a){
  case "tab":go(t.dataset.t);break;
  case "flt":{var f={},kv=t.dataset.f.split(":");f[kv[0]]=kv[0]==="q"?decodeURIComponent(kv.slice(1).join(":")):kv.slice(1).join(":");go(t.dataset.go||"list",f);break}
  case "open":{var o=S.orders.filter(function(x){return x.id===t.dataset.id})[0];if(o)openJob(o);break}
  case "new":newJob();break;
  case "addrow":{var tb=$("#items tbody");tb.insertAdjacentHTML("beforeend",itemRow());break}
  case "delrow":{var tr=t.closest("tr");if(document.querySelectorAll("#items tbody tr").length>1)tr.remove();else{Array.prototype.forEach.call(tr.querySelectorAll("input"),function(i){i.value=""})}recalc();break}
  case "closedlg":S.queue=[];closeDlg();break;
  case "discard":S.queue=[];closeDlg();toast("破棄しました(登録していません)");break;
  case "savejob":await saveJob();break;
  case "advance":{var sel=$("#f-status"),v=Number(sel.value);if(v<7){sel.value=v+1;toast("状態を「"+ST[v+1]+"」にしました。保存で確定します")}break}
  case "deljob":if(t.dataset.armed!=="1"){t.dataset.armed="1";t.textContent="もう一度押すと削除";t.classList.add("pri");setTimeout(function(){if(t.isConnected){t.dataset.armed="";t.textContent="削除";t.classList.remove("pri")}},4000);break}
   try{await Store.delOrder(S.dlg.job.id);closeDlg();await reload();toast("削除しました")}catch(x){toast("削除に失敗しました: "+(x.message||x.code))}break;
  case "ingest":await doIngest(false);break;
  case "force":await doIngest(true);break;
  case "pick":$("#fi").click();break;
  case "pickz":$("#fzi").click();break;
  case "forcework":t.disabled=true;await forceWork(t.dataset.k);break;
  case "sample":{var s=AP.SAMPLES[Number(t.dataset.i)];$("#mt").value=s.text;S.eml=null;$("#emlinfo").textContent="";break}
  case "copyscr":{var txt=scriptText();try{await navigator.clipboard.writeText(txt);toast("コピーしました")}catch(x){var r=document.createRange();r.selectNodeContents($("#scr"));var sl=getSelection();sl.removeAllRanges();sl.addRange(r);toast("選択しました。Ctrl+C でコピーしてください")}break}
  case "csv":csvOut();break;
  case "gmsearch":await gmSearch();break;
  case "gmimport":await gmImport();break;
  case "addstaff":{var v2=$("#ns").value.trim();if(!v2)break;S.settings.staff=(S.settings.staff||[]).concat([v2]);await saveSettings();render();break}
  case "delstaff":S.settings.staff.splice(Number(t.dataset.i),1);await saveSettings();render();break;
  case "saveown":S.settings.own=$("#own").value.split("\n").map(function(x){return x.trim()}).filter(Boolean);await saveSettings();toast("保存しました");break;
  case "bkexp":{var d=await Store.exportAll();download("alpha-orders-backup-"+today()+".json",JSON.stringify(d),"application/json");break}
  case "bkimp":$("#bkf").click();break;
  case "logout":await post("/api/auth",{op:"logout"});location.reload();break;
 }
});
document.addEventListener("input",function(ev){
 var t=ev.target;
 if(t.id==="q"){S.f.q=t.value;renderList()}
 else if(t.closest&&t.closest("#items"))recalc();
});
document.addEventListener("change",function(ev){
 var t=ev.target;
 if(t.id==="fstaff"){S.f.staff=t.value;renderList()}
 else if(t.id==="fsp"){S.f.sp=t.value;renderList()}
 else if(t.id==="fkind"){S.f.kind=t.value;renderList()}
 else if(t.id==="fi"){readFile(t.files[0]);t.value=""}
 else if(t.id==="fzi"){var fl=Array.prototype.slice.call(t.files);t.value="";importFiles(fl)}
 else if(t.id==="zpwkeep"){zpwSet(t.checked?($("#zpw")||{}).value||"":"")}
 else if(t.id==="bkf"){var f=t.files[0];if(!f)return;var fr=new FileReader();fr.onload=async function(){try{var n=await Store.importAll(JSON.parse(fr.result));await reload();toast(n+"件を読み込みました")}catch(x){toast("読み込めませんでした: "+x.message)}};fr.readAsText(f);t.value=""}
});
document.addEventListener("dragover",function(ev){var z=ev.target.closest&&ev.target.closest("#dz,#fz");if(z){ev.preventDefault();z.classList.add("on")}});
document.addEventListener("dragleave",function(ev){["#dz","#fz"].forEach(function(q){var z=$(q);if(z)z.classList.remove("on")})});
document.addEventListener("drop",function(ev){var z=ev.target.closest&&ev.target.closest("#dz,#fz");if(!z)return;ev.preventDefault();z.classList.remove("on");if(z.id==="fz")importFiles(Array.prototype.slice.call(ev.dataTransfer.files));else readFile(ev.dataTransfer.files[0])});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&S.dlg){S.queue=[];closeDlg()}});

async function saveSettings(){try{await Store.saveSettings(S.settings)}catch(x){toast("保存に失敗しました: "+(x.message||x.code))}}
async function reload(noRender){
 var d=await Store.load();S.orders=d.orders;S.mails=d.mails;S.settings=Object.assign({staff:[],own:[]},d.settings||{});
 if(!noRender&&!S.dlg){if(S.tab==="import"){renderNav();renderLog()}else render()}
 else renderNav();
}

/* ================= 起動・ログイン ================= */
function loginUi(){
 return new Promise(function(resolve){
  var w=document.createElement("div");w.className="login";
  w.innerHTML='<form><h1>アルファ受注ナビ</h1><div class="sub">パスワードを入力してください</div><input type="password" id="lpw" autocomplete="current-password" autofocus><div class="sub" id="lerr" style="color:var(--bad);min-height:18px"></div><button class="btn pri" style="width:100%;padding:10px">ログイン</button></form>';
  document.body.appendChild(w);var inp=$("#lpw");setTimeout(function(){inp.focus()},50);
  $("form",w).onsubmit=async function(ev){ev.preventDefault();$("#lerr").textContent="";
   try{var r=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({op:"login",password:inp.value})});var j=await r.json();
    if(r.ok&&j.ok){w.remove();resolve(j)}else{$("#lerr").textContent="パスワードが違います";inp.select()}}catch(x){$("#lerr").textContent="通信に失敗しました"}};
 });
}
async function useCap(n){try{return window.claude&&window.claude.use?await window.claude.use(n):null}catch(x){return null}}
async function boot(){
 var info=null;
 if(window.claude&&window.claude.use){
  S.mode="loading";render();
  var caps=await Promise.all([useCap("db"),useCap("sample"),useCap("mcp"),useCap("downloads"),useCap("assets")]);
  CAP.db=caps[0];CAP.sample=caps[1];CAP.mcp=caps[2];CAP.downloads=caps[3];CAP.assets=caps[4];
  if(CAP.db){
   Store=Art;S.mode="artifact";S.flags={ai:!!CAP.sample,inbound:false};
   await Art.start(function(){if(!S.busy)reload()});
   await reload(true);render();return;
  }
 }
 if(location.protocol!=="file:"&&!(window.claude&&window.claude.use)){
  try{
   var r=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({op:"check"})});
   var j=await r.json();
   if(j&&j.nopw){S.nopw=true}
   else if(j&&j.ok)info=j;
   else if(j&&j.ok===false)info=await loginUi();
  }catch(x){info=null}
 }
 if(info){Store=Server;S.mode="server";S.flags={ai:!!info.ai,inbound:!!info.inbound}}
 else{Store=Local;S.mode="local"}
 try{await reload(true)}catch(x){toast("データを読み込めませんでした: "+x.message)}
 render();
 if(S.nopw)toast("サーバーに APP_PASSWORD が設定されていないため、お試しモードで開きました");
 if(Store.mode==="server")setInterval(function(){if(!document.hidden)checkNew()},20000);
}
boot();
})();
