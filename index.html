<title>アルファ受注ナビ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
:root{--bg:#f5f5f6;--surface:#fff;--ink:#26262b;--muted:#6b6b73;--line:#e5e5e8;--accent:#d6001d;--accent-ink:#fff;--accent-soft:#fdeaed;--logo-gray:#898989;
--side:#2b2b30;--side-ink:#ececef;--side-mute:#a3a3ab;--warn:#b45309;--warn-soft:#fdf0d9;--bad:#b42318;--bad-soft:#fde8e6;--ok:#1d7a3a;--ok-soft:#e1f2e5;
--f-head:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;--f-body:"Noto Sans JP","Hiragino Sans","Meiryo",sans-serif;--toast-bg:#26262b;--toast-ink:#fff;--code-bg:#2b2b30;--code-ink:#e8e8ee}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141416;--surface:#1e1e22;--ink:#ececef;--muted:#a3a3ab;--line:#33333a;--accent:#ff4d63;--accent-ink:#1a0508;--accent-soft:#3a1519;--logo-gray:#898989;
--side:#0f0f11;--side-ink:#ececef;--side-mute:#a3a3ab;--warn:#f0b35a;--warn-soft:#3a2c12;--bad:#ff8f84;--bad-soft:#3d1f1c;--ok:#7fd49a;--ok-soft:#173523;--toast-bg:#ececef;--toast-ink:#141416;--code-bg:#0f0f11;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141416;--surface:#1e1e22;--ink:#ececef;--muted:#a3a3ab;--line:#33333a;--accent:#ff4d63;--accent-ink:#1a0508;--accent-soft:#3a1519;--logo-gray:#898989;
--side:#0f0f11;--side-ink:#ececef;--side-mute:#a3a3ab;--warn:#f0b35a;--warn-soft:#3a2c12;--bad:#ff8f84;--bad-soft:#3d1f1c;--ok:#7fd49a;--ok-soft:#173523;--toast-bg:#ececef;--toast-ink:#141416;--code-bg:#0f0f11;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:14px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:9px;padding:2px 2px 16px;font-family:var(--f-head);font-weight:700;font-size:15px;color:#fff}
.plate{background:#fff;border-radius:10px;padding:11px 12px 10px;border-top:4px solid var(--accent);display:block}
.plate img{display:block;width:100%;height:auto}
.brand small{display:block;font-size:10.5px;font-weight:400;color:var(--side-mute);letter-spacing:.08em;margin-top:1px}
.brand .nm{padding:0 4px}
.topbar .tlogo{height:22px;width:auto;display:none}
.nv{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--side-ink);padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;font-weight:500}
.nv:hover{background:rgba(255,255,255,.08)}
.nv[aria-current=page]{background:var(--accent);color:#fff;font-weight:700}
.nv .n{margin-left:auto;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;text-align:center;line-height:18px}
.sidefoot{margin-top:auto;font-size:11.5px;color:var(--side-mute);padding:10px 8px 0;line-height:1.6}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mainwrap{min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:10px max(20px,env(safe-area-inset-right,0px)) 10px 20px;min-height:54px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
.topbar .sp{flex:1}
.chipst{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted);white-space:nowrap}
.chipst.on{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
main{padding:22px max(20px,env(safe-area-inset-right,0px)) 60px 20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.pghead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pghead h2{font-family:var(--f-head);font-size:24px;margin:0}
.pgact{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.out{border-color:var(--accent);color:var(--accent);font-weight:700}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 11px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=date],input[type=number],input[type=search],input[type=tel],input[type=email],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical;line-height:1.6}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.grid{display:grid;gap:12px}
.alerts{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.alert{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.alert b{font-family:var(--f-head);font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.alert span{font-size:12px;color:var(--muted)}
.alert.hot{border-color:var(--bad);background:var(--bad-soft)}.alert.hot b{color:var(--bad)}
.alert.warm{border-color:var(--warn)}.alert.warm b{color:var(--warn)}
.alert.static{cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card2{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card2 h3,.panel>h3{font-family:var(--f-head);font-size:16px;margin:0 0 10px}
.panel>h3{padding:12px 14px 0}
.home{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.todo{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 4px;cursor:pointer}
.todo:first-of-type{border-top:0}
.todo:hover{background:var(--accent-soft)}
.todo .dt{font-size:13px;font-variant-numeric:tabular-nums}
.todo .tt{font-weight:700;min-width:0;overflow-wrap:anywhere}
.todo .tt small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line)}
.stat:last-child{border-bottom:0}.stat span{color:var(--muted)}.stat b{font-family:var(--f-head);font-size:18px;font-variant-numeric:tabular-nums}
.pipe{display:flex;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.pipe button{flex:1 0 98px;border:0;border-right:1px solid var(--line);background:none;padding:8px 10px;cursor:pointer;text-align:left}
.pipe button:last-child{border-right:0}
.pipe button[aria-pressed=true]{background:var(--accent-soft)}
.pipe b{display:block;font-size:19px;font-family:var(--f-head);font-variant-numeric:tabular-nums}
.pipe span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input[type=search]{flex:1 1 220px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:820px}
th{font-size:11.5px;color:var(--muted);text-align:left;font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}tbody tr.row:hover{background:var(--accent-soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nw{white-space:nowrap}.site{font-weight:700}.sub{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--line)}
.pill.s0,.pill.s1{background:var(--warn-soft);color:var(--warn)}
.pill.s2,.pill.s3,.pill.s4{background:var(--accent-soft);color:var(--accent)}
.pill.s5,.pill.s6,.pill.s7{background:var(--ok-soft);color:var(--ok)}
.pill.s8{background:var(--line);color:var(--muted)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--muted);white-space:nowrap}
.tag.rv{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.tag.kq{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}.tag.ko{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.tag.ug{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.late{color:var(--bad);font-weight:700}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:14px;color:var(--muted);text-align:center;cursor:pointer;font-size:13px}
.drop.on,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row2 .sp{flex:1}
.res{display:flex;flex-direction:column;gap:10px}
.rc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.rc.ok{border-color:var(--ok);background:var(--ok-soft)}.rc.warn{border-color:var(--warn);background:var(--warn-soft)}
.rc .b{flex:1;min-width:220px}
pre.code{background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:12px 14px;overflow:auto;font-size:12px;line-height:1.55;max-height:300px;margin:8px 0}
.mask{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:80;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:16px 12px 24px}
.dlg{background:var(--surface);border-radius:14px;width:min(900px,100%);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-family:var(--f-head);margin:0;font-size:18px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.fields label.wide{grid-column:1/-1}
.fields input,.fields select,.fields textarea{color:var(--ink);font-size:14px;width:100%}
.fields label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.fields label.chk input{width:auto}
.items{min-width:0}
.items td{padding:4px 4px}.items th{padding:4px}
.items input{width:100%}.items .q{width:76px;text-align:right}.items .u{width:64px}.items .p{width:96px;text-align:right}
.items td.amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.sum{display:flex;gap:18px;justify-content:flex-end;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.sum b{font-family:var(--f-head);font-size:18px}
.acts{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.hist{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
details summary{cursor:pointer;font-weight:700;font-size:13px}
.mailbody{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px;max-height:260px;overflow:auto;margin-top:6px}
.issues{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px}
.issues ul{margin:4px 0 0 18px;padding:0}
.phs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.phc{border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:5px;background:var(--bg)}
.phc img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;cursor:zoom-in;background:#0001}
.phc select,.phc input{font:inherit;font-size:12.5px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
.rel{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}.rel:first-child{border-top:0}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.docs .doc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;min-width:0}
.docs .dh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg2,#0000000a)}
.docs .dh b{font-size:13px}.docs .dh .sp{flex:1}
.docs .dbody{padding:8px;display:flex;flex-direction:column;gap:8px;max-height:560px;overflow:auto;background:#8884}
.docs .dbody canvas{width:100%;height:auto;border-radius:6px;background:#fff;box-shadow:0 1px 4px #0003;cursor:zoom-in}
.docs .dempty{padding:26px 12px;text-align:center;color:var(--mute,#888);font-size:13px}
.pvw{position:fixed;inset:0;z-index:95;background:#000d;display:flex;flex-direction:column}
.pvw .pb{display:flex;align-items:center;gap:8px;padding:10px 14px;color:#fff;flex-wrap:wrap}
.pvw .pb b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50vw}
.pvw .pb .sp{flex:1}
.pvw .pb .btn{background:#ffffff1f;color:#fff;border-color:#ffffff40}
.pvw .pb a.btn{text-decoration:none}
.pvw .pbody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 14px 14px}
.pvw iframe{width:min(1000px,100%);height:100%;border:0;background:#fff;border-radius:6px}
.pvw img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.pvw .none{color:#fff;text-align:center;line-height:1.9}
.srv{width:100%;border-collapse:collapse;font-size:13.5px}
.srv th{width:34%;text-align:left;color:var(--muted);font-weight:500;padding:7px 8px 7px 0;vertical-align:top;border-bottom:1px dashed var(--line)}
.srv td{padding:7px 0;vertical-align:top;border-bottom:1px dashed var(--line);word-break:break-all}
.srv code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12px}
@media (max-width:600px){.srv th{width:40%}}
.gm{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap;color:var(--muted);background:var(--surface)}
.gm i{width:9px;height:9px;border-radius:50%;background:#9a9aa2;display:inline-block}
.gm.ok{color:var(--ok);border-color:var(--ok)}.gm.ok i{background:var(--ok);animation:gmp 2.4s ease-in-out infinite}
.gm.warn{color:var(--warn);border-color:var(--warn)}.gm.warn i{background:var(--warn)}
.gm.bad{color:var(--bad);border-color:var(--bad)}.gm.bad i{background:var(--bad)}
.sidefoot .gm{background:transparent;margin-bottom:8px;font-size:12px}
@keyframes gmp{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 4px #1d7a3a33}}
@media (prefers-reduced-motion:reduce){.gm.ok i{animation:none}}
.rpt{position:fixed;inset:0;z-index:80;background:#0008;overflow:auto;padding:14px}
.rpt .bar{max-width:820px;margin:0 auto 10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.rpt .pg{max-width:820px;margin:0 auto;background:#fff;color:#111;padding:28px 32px;border-radius:6px;font-size:13.5px;line-height:1.6}
.rpt h1{font-size:21px;text-align:center;letter-spacing:.3em;margin:0 0 14px;border-bottom:2px solid #111;padding-bottom:8px}
.rpt table{width:100%;min-width:0;table-layout:fixed;border-collapse:collapse;margin:0 0 12px;display:table}
.rpt th,.rpt td{border:1px solid #888;padding:4px 8px;text-align:left;vertical-align:top;font-size:13px;color:#111;word-break:break-all}
.rpt th{background:#f1f1f1;width:24%;font-weight:600;white-space:normal}
.rpt .ed{border:1px solid #888;min-height:70px;padding:6px 8px;white-space:pre-wrap;outline:none}
.rpt .ed:focus{background:#fffbe6}
.rpt h3{font-size:14px;margin:12px 0 4px;border-left:4px solid #111;padding-left:6px}
.rpt .rg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rpt .rg figure{margin:0;border:1px solid #888;padding:4px;break-inside:avoid}
.rpt .rg img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.rpt .rg figcaption{font-size:12px;padding-top:3px}
.rpt .rg figcaption b{background:#222;color:#fff;border-radius:3px;padding:0 5px;margin-right:4px;font-weight:500}
@media print{body>*:not(#rpt){display:none!important}.rpt{position:static;background:none;padding:0;overflow:visible}.rpt .bar{display:none}.rpt .pg{max-width:none;padding:0;border-radius:0}.rpt .ed{border-color:#888}}

 .items{min-width:560px}
 #ttl{display:none}.topbar{gap:8px}.topbar .sp{flex:1}

 .pgact{flex-wrap:wrap}.alerts{grid-template-columns:repeat(2,minmax(0,1fr))}

 .bnav button{flex:1 0 64px;position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10.5px;color:var(--muted);cursor:pointer;border-radius:10px;min-height:52px}

}

function scriptText(){
 return "// アルファ受注ナビ: Gmail の依頼メールを自動で取り込む(Google Apps Script)\n// 使い方: script.google.com に貼り付け → TOKEN を設定 → トリガーで importOrders を「5分ごと」に実行\nconst ENDPOINT = '__ORIGIN__/api/inbound';\nconst TOKEN = 'ここに INBOUND_TOKEN を貼り付け';\n// 拾うメールの条件(Gmailの検索と同じ書き方)。取引先で絞るなら from:@alphapurchase.co.jp などを足す\nconst QUERY = 'in:inbox newer_than:3d -label:AP取込済 (filename:zip OR filename:pdf OR 作業依頼 OR 見積 OR 注文 OR 発注 OR 依頼)';\nconst DONE_LABEL = 'AP取込済';\n\nfunction importOrders() {\n  const done = GmailApp.getUserLabelByName(DONE_LABEL) || GmailApp.createLabel(DONE_LABEL);\n  const me = Session.getActiveUser().getEmail();\n  GmailApp.search(QUERY, 0, 20).forEach(function (th) {\n    let ok = true;\n    th.getMessages().forEach(function (m) {\n      if (m.isInTrash() || (me && m.getFrom().indexOf(me) >= 0)) return;\n      const body = m.getPlainBody() || '';\n      const atts = m.getAttachments({ includeInlineImages: false }).filter(function (a) { return /\\.(zip|pdf)$/i.test(a.getName()); });\n      // パスワード通知だけのメールは単独では送らない(添付メールを処理するときに前後のメールとして読む)\n      if (!atts.length && /パスワード|password|解凍/i.test(m.getSubject() + body.slice(0, 400)) && body.length < 2000) return;\n      const payload = {\n        messageId: m.getId(), from: m.getFrom(), subject: m.getSubject(), date: m.getDate().toISOString(), body: body.slice(0, 20000),\n        attachments: atts.map(function (a) { return { name: a.getName(), b64: Utilities.base64Encode(a.getBytes()) }; }),\n        pwTexts: atts.length ? neighbors(m) : []\n      };\n      const res = UrlFetchApp.fetch(ENDPOINT, {\n        method: 'post', contentType: 'application/json', muteHttpExceptions: true,\n        headers: { Authorization: 'Bearer ' + TOKEN }, payload: JSON.stringify(payload)\n      });\n      const code = res.getResponseCode();\n      // 422 = ZIPのパスワードがまだ見つからない(パスワードのメールが後から届くことがある)→ 次回やり直す\n      if (code !== 200) { ok = false; console.log(m.getSubject() + ' : ' + code + ' ' + res.getContentText().slice(0, 300)); }\n    });\n    if (ok) th.addLabel(done);\n  });\n}\n\n// 添付メールの前後1通(同じ差出人)と、同じ時間帯のパスワード通知メール\nfunction neighbors(m) {\n  const from = (m.getFrom().match(/<([^>]+)>/) || [null, m.getFrom()])[1].trim();\n  const t = m.getDate().getTime(), day = 864e5;\n  const fmt = function (d) { return Utilities.formatDate(d, 'Asia/Tokyo', 'yyyy/MM/dd'); };\n  const q = 'from:' + from + ' after:' + fmt(new Date(t - day)) + ' before:' + fmt(new Date(t + 2 * day));\n  const list = [], seen = {};\n  GmailApp.search(q, 0, 30).forEach(function (th) {\n    th.getMessages().forEach(function (x) { if (!seen[x.getId()]) { seen[x.getId()] = 1; list.push(x); } });\n  });\n  list.sort(function (a, b) { return a.getDate() - b.getDate(); });\n  const i = list.findIndex(function (x) { return x.getId() === m.getId(); });\n  const pick = [];\n  if (i >= 0 && list[i + 1]) pick.push(list[i + 1]);\n  if (i > 0) pick.push(list[i - 1]);\n  list.forEach(function (x) {\n    if (x.getId() !== m.getId() && pick.indexOf(x) < 0 && /パスワード|password|PW|解凍/i.test(x.getSubject() + x.getPlainBody().slice(0, 500))) pick.push(x);\n  });\n  return pick.slice(0, 6).map(function (x) { return { subject: x.getSubject(), body: x.getPlainBody().slice(0, 8000) }; });\n}\n".replace("__ORIGIN__",location.origin);
}

var LIB={pdflib:"https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js",pdf:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",pdfw:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",zip:"https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.62/dist/zip-full.min.js"};
function zpwGet(){try{return localStorage.getItem("ap:zpw")||""}catch(x){return ""}}
function zpwSet(v){try{if(v)localStorage.setItem("ap:zpw",v);else localStorage.removeItem("ap:zpw")}catch(x){}}
function loadScript(src){return new Promise(function(res,rej){var sc=document.createElement("script");sc.src=src;sc.onload=res;sc.onerror=function(){rej(new Error("読み込みに失敗しました: "+src.split("/").pop()))};document.head.appendChild(sc)})}
var libsP=null;
function libs(){
 if(!libsP)libsP=(async function(){
  await loadScript(LIB.pdf);await loadScript(LIB.pdfw);await loadScript(LIB.zip);
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=LIB.pdfw;
  window.zip.configure({useWebWorkers:false});
 })().catch(function(x){libsP=null;throw x});
 return libsP;
}
// PDF → 行ごとの文字(同じ高さの文字を1行に、離れたセルはタブ区切り)
async function pdfDoc(blob){return await window.pdfjsLib.getDocument({data:new Uint8Array(await blob.arrayBuffer()),isEvalSupported:false}).promise}
async function pdfText(doc,asPages){
 var out=[],pages=[];
 for(var p=1;p<=doc.numPages;p++){
  var pg=await doc.getPage(p),tc=await pg.getTextContent(),rows=[];
  tc.items.filter(function(i){return i.str&&i.str.trim()}).forEach(function(i){var y=i.transform[5],r=null;for(var k=0;k<rows.length;k++)if(Math.abs(rows[k].y-y)<3){r=rows[k];break}if(!r){r={y:y,it:[]};rows.push(r)}r.it.push({s:i.str,x:i.transform[4],w:i.width})});
  rows.sort(function(a,b){return b.y-a.y});
  rows.forEach(function(r){r.it.sort(function(a,b){return a.x-b.x});var line="",end=null;r.it.forEach(function(i){if(end!=null&&i.x-end>6)line+="\t";line+=i.s;end=i.x+i.w});out.push(line)});
  out.push("");
  if(asPages)pages.push(out.splice(0).join("\n"));
 }
 return asPages?pages:out.join("\n");
}
async function pdfImage(doc){
 var pg=await doc.getPage(1),vp=pg.getViewport({scale:2}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
 await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
 return await new Promise(function(r){c.toBlob(r,"image/png")});
}
// ZIP を開いて PDF を取り出す(パスワード付き・入れ子のZIP・日本語ファイル名に対応)
async function unzipPdfs(blob,pw,depth){
 var rd=new window.zip.ZipReader(new window.zip.BlobReader(blob),{password:pw||undefined}),out=[];
 try{
  var ents=await rd.getEntries({decodeText:function(b){try{return new TextDecoder("utf-8",{fatal:true}).decode(b)}catch(x){try{return new TextDecoder("shift_jis").decode(b)}catch(y){return ""}}}});
  for(var i=0;i<ents.length;i++){
   var en=ents[i];if(en.directory)continue;
   var nm=en.filename.split("/").pop();
   if(/^\._|^__MACOSX/.test(en.filename))continue;
   if(/\.pdf$/i.test(nm))out.push({name:nm,blob:await en.getData(new window.zip.BlobWriter("application/pdf"),{password:pw||undefined})});
   else if(/\.zip$/i.test(nm)&&(depth||0)<2)out=out.concat(await unzipPdfs(await en.getData(new window.zip.BlobWriter("application/zip"),{password:pw||undefined}),pw,(depth||0)+1));
  }
 }finally{try{await rd.close()}catch(x){}}
 return out;
}
/* ZIPのパスワードを Gmail から探す: 添付メール(ファイル名で検索)→同じ差出人の前後1通→本文の候補を実際に試す */
S.pwCache={};
async function gmP(tool,input){var r=await CAP.mcp.callTool("Gmail",tool,input,{cache:false});return (r&&r.payload)||{}}
function gday(ms){var d=new Date(ms+9*36e5);return d.getUTCFullYear()+"/"+(d.getUTCMonth()+1)+"/"+d.getUTCDate()}
async function gmFind(q,n){var p=await gmP("search_threads",{query:q,pageSize:n||20}),out=[];(p.threads||[]).forEach(function(t){(t.messages||[]).forEach(function(m){if(m&&m.id)out.push(m)})});return out}
async function gmMeta(id){var p=await gmP("get_message",{messageId:id,messageFormat:"MINIMAL"});return {id:id,t:Number(p.internalDate)||Date.parse(p.date||"")||0,sender:p.sender||"",subject:p.subject||"",snippet:p.snippet||""}}
async function gmBody(id){var p=await gmP("get_message",{messageId:id,messageFormat:"PLAIN_TEXT"});return {subject:p.subject||"",text:(p.subject||"")+"\n"+(p.plaintextBody||p.plaintext_body||p.plainTextBody||p.body||p.snippet||"")}}
async function zipOk(blob,pw){try{var r=await unzipPdfs(blob,pw);return r.length>0}catch(x){return false}}
async function findZipPassword(file,status){
 if(!CAP.mcp)return null;
 var tried={},name=file.name,base=name.replace(/\s*\(\d+\)(?=\.zip$)/i,"");
 async function tryMail(id,why){
  var b=await gmBody(id),c=AP.extractPasswords(b.text);
  for(var i=0;i<c.length;i++){if(tried[c[i]])continue;tried[c[i]]=1;if(await zipOk(file,c[i]))return {pw:c[i],subject:b.subject,why:why}}
  return null;
 }
 status("Gmailで添付メールを探しています…");
 var att=await gmFind('filename:"'+base+'"',10);
 if(!att.length&&base!==name)att=await gmFind('filename:"'+name+'"',10);
 var seen={};
 for(var a=0;a<att.length&&a<3;a++){
  var am=await gmMeta(att[a].id);if(!am.t)continue;
  var from=AP.parseFrom(am.sender).email||am.sender;
  status("前後のメールからパスワードを探しています…");
  var near=await gmFind((from?"from:"+from+" ":"")+"after:"+gday(am.t-864e5)+" before:"+gday(am.t+2*864e5),30);
  var metas=[];for(var i=0;i<near.length;i++){if(seen[near[i].id])continue;seen[near[i].id]=1;metas.push(near[i].id===am.id?am:await gmMeta(near[i].id))}
  if(!metas.some(function(m){return m.id===am.id}))metas.push(am);
  metas.sort(function(x,y){return x.t-y.t});
  var k=metas.findIndex(function(m){return m.id===am.id}),order=[];
  if(k>=0){if(metas[k+1])order.push([metas[k+1],"直後のメール"]);if(metas[k-1])order.push([metas[k-1],"直前のメール"])}
  metas.forEach(function(m){if(m.id!==am.id&&/パスワード|password|PW|解凍/i.test(m.subject+" "+m.snippet)&&!order.some(function(o){return o[0].id===m.id}))order.push([m,"同じ時間帯のパスワード通知"])});
  for(var j=0;j<order.length;j++){var r=await tryMail(order[j][0].id,order[j][1]);if(r)return r}
 }
 // 添付メールが見つからないとき: 最近のパスワード通知メールを順に試す
 status("最近のパスワード通知メールを確認しています…");
 var pwm=await gmFind("(パスワード OR password OR 解凍) newer_than:14d",15);
 for(var q=0;q<pwm.length&&q<15;q++){var r2=await tryMail(pwm[q].id,"最近のパスワード通知");if(r2)return r2}
 return null;
}
function zipErr(x){var m=String(x&&x.message||x);if(/password|encrypted/i.test(m))return /invalid/i.test(m)?"ZIPのパスワードが違います":"このZIPはパスワード付きです。パスワードを入れてからもう一度ドロップしてください";return m}
async function workFromPdf(name,blob){
 var doc=await pdfDoc(blob),text=await pdfText(doc);
 if(AP.isWorkOrder(text))return {w:AP.parseWorkOrder(text),ai:false};
 if(!CAP.sample)throw new Error("作業依頼書の書式ではないため読み取れませんでした(AIの読み取りが使えない状態です)");
 var raw;
 if(text.replace(/\s/g,"").length>80)raw=await CAP.sample.json(AP.buildWorkPrompt(text,false),{modelTier:"default"});
 else{var img=await pdfImage(doc);raw=await CAP.sample.json(AP.buildWorkPrompt("",true),{modelTier:"default",images:[img]})}

async function registerWork(name,blob,w,ai,force){

S.dupOn=false;
function dupGroups(){
 var L=S.orders.filter(function(o){return o.status!==8}),par={};
 function f(x){while(par[x]!==x)x=par[x]=par[par[x]];return x}
 L.forEach(function(o){par[o.id]=o.id});
 var seen={};
 function link(k,o){if(!k)return;if(seen[k]===undefined)seen[k]=o.id;else par[f(o.id)]=f(seen[k])}
 L.forEach(function(o){
  link(o.reqNo&&"r:"+o.reqNo,o);link(o.caseNo&&"c:"+o.caseNo,o);
  var t=(title(o)+"|"+(o.subject||"")).replace(/[\s　【】]/g,"").replace(/\d{6,}/g,"");
  link(t.length>6&&"t:"+t,o);
 });
 var g={};L.forEach(function(o){var r=f(o.id);(g[r]=g[r]||[]).push(o)});
 return Object.keys(g).map(function(k){return g[k]}).filter(function(a){return a.length>1}).map(function(a){
  return a.slice().sort(function(x,y){return ((y.files||[]).length-(x.files||[]).length)||(x.reqNo?0:1)-(y.reqNo?0:1)||String(x.createdAt||x.no).localeCompare(String(y.createdAt||y.no))});
 });
}

/* 未処理メールのうち、既存の案件に関係するもの(作業依頼番号・顧客案件番号・店舗名)を自動で関連メールにする */
function caseForMail(m){
 var live=S.orders.filter(function(o){return o.status!==8}),text=String(m.subject||"")+"\n"+String(m.body||""),i,x;
 var flat=text.replace(/[\s　]/g,"");
 for(i=0;i<live.length;i++){x=live[i];if([x.reqNo,x.caseNo,x.no].some(function(v){v=String(v||"").trim();return v.length>=6&&flat.indexOf(v)>=0}))return x}
 var nums=text.match(/(?:^|[^0-9])(\d{8})(?:[^0-9]|$)/g)||[];for(i=0;i<nums.length;i++){var d=nums[i].replace(/\D/g,"");x=live.filter(function(o){return String(o.subject||"").indexOf(d)>=0})[0];if(x)return x}
 var sj=aNrm(String(m.subject||"").replace(/【[^】]*】/g,""));
 if(sj.length>=6){var c=live.filter(function(o){return [o.site,o.subject].some(function(t){var n=aNrm(t);return n&&aLcs(n,sj)>=6})});if(c.length===1)return c[0]}
 return null;
}
async function autoLinkMails(quiet){
 var n=0,todo=mailTodo();
 for(var i=0;i<todo.length;i++){var m=todo[i],o=caseForMail(m);if(!o)continue;
  linkMail(o,m);m.was=m.state;m.state="done";m.doneAt=new Date().toISOString();
  try{await Store.saveOrder(o);await Store.saveMail(m);n++}catch(x){m.state=m.was}}
 if(n){await reload(true);render()}
 if(!quiet)toast(n?n+" 件を関連する案件に紐づけました":"紐づけられるメールは見つかりませんでした");
 return n;
}

var DOCC={};
async function docPages(href){
 if(DOCC[href])return DOCC[href];
 await libs();
 var r=await fetch(href,{credentials:"same-origin"});if(!r.ok)throw new Error("開けませんでした("+r.status+")");
 var doc=await pdfDoc(await r.blob()),out=[];
 for(var p=1;p<=Math.min(doc.numPages,4);p++){
  var pg=await doc.getPage(p),vp=pg.getViewport({scale:1.6}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
  await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;out.push(c.toDataURL("image/jpeg",0.85));
 }
 return (DOCC[href]=out);
}

// 写真を縮小(長辺1280px・JPEG)。スマホの大きな写真もそのまま送れるように
function shrinkImage(file){
 return new Promise(function(res,rej){
  var url=URL.createObjectURL(file),im=new Image();
  im.onload=function(){
   var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,1280/Math.max(w,h)),c=document.createElement("canvas");
   c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
   var q=0.78,d=c.toDataURL("image/jpeg",q);
   while(d.length>820000&&q>0.35){q-=0.1;d=c.toDataURL("image/jpeg",q)}
   c.toBlob(function(b){res({dataUrl:d,blob:b,name:(file.name||"photo").replace(/\.[^.]+$/,"")+".jpg"})},"image/jpeg",q);
  };
  im.onerror=function(){URL.revokeObjectURL(url);rej(new Error("画像として読めませんでした: "+(file.name||"")))};
  im.src=url;
 });
}

 GA.busy=true;var sent=0,scanned=0;
 try{
  var r=await CAP.mcp.callTool("Gmail","search_threads",{query:GM_Q,pageSize:30},{cache:false});
  var th=(r.payload&&r.payload.threads)||[],list=[];
  th.forEach(function(t){(t.messages||[]).forEach(function(m){if(m&&m.id&&!gmDone(m))list.push(m)})});
  scanned=list.length;
  for(var i=0;i<list.length&&i<10;i++){
   var m=list[i];
   var q=await CAP.mcp.callTool("Gmail","get_message",{messageId:m.id,messageFormat:"FULL_CONTENT"},{cache:false}),p=q.payload||{};
   var body=p.plaintextBody||p.plaintext_body||p.plainTextBody||p.body||p.snippet||"";
   var atn=(p.attachments||[]).map(function(x){return x&&(x.filename||x.name)||""}).filter(function(n){return /\.(zip|pdf)$/i.test(n)});
   if(atn.length){
    // ZIP・PDFの添付は、この画面からは中身を取り出せない。Vercel版(自動でパスワードも前後のメールから探して解凍)で処理されるか、「書類の確認」から追加する

    continue;
   }
   var out=await Store.ingest({text:String(body),from:p.sender||m.sender,subject:p.subject||m.subject,date:p.date||m.date||"",messageId:m.id,source:"gmail"});

 drawGm();if(sent){renderNav();render();toast("Gmailから "+sent+" 件登録しました")}

document.addEventListener("input",function(ev){
 var t=ev.target;
 if(t.id==="q"){S.f.q=t.value;renderList()}
 else if(t.closest&&t.closest("#items"))recalc();
});
document.addEventListener("change",function(ev){
 var t=ev.target;
 if(t.id==="fstaff"){S.f.staff=t.value;renderList()}
 else if(t.id==="fsp"){S.f.sp=t.value;renderList()}
 else if(t.id==="fkind"){S.f.kind=t.value;renderList()}
 else if(t.id==="fi"){readFile(t.files[0]);t.value=""}
 else if(t.id==="wpf"||(t.classList&&t.classList.contains("wpf2"))){var fl=Array.prototype.slice.call(t.files),keep=S.dlg&&S.dlg.job&&S.dlg.job.id;t.value="";workUpload(fl,keep)}
 else if(t.id==="phi"){var fl3=Array.prototype.slice.call(t.files);t.value="";addPhotos(fl3)}
 else if(t.id==="fzi"){var fl=Array.prototype.slice.call(t.files);t.value="";importFiles(fl)}
 else if(t.id==="zpwkeep"){zpwSet(t.checked?($("#zpw")||{}).value||"":"")}
 else if(t.id==="bkf"){var f=t.files[0];if(!f)return;var fr=new FileReader();fr.onload=async function(){try{var n=await Store.importAll(JSON.parse(fr.result));await reload();toast(n+"件を読み込みました")}catch(x){toast("読み込めませんでした: "+x.message)}};fr.readAsText(f);t.value=""}
});
document.addEventListener("dragover",function(ev){var z=ev.target.closest&&ev.target.closest("#dz,#fz");if(z){ev.preventDefault();z.classList.add("on")}});
document.addEventListener("dragleave",function(ev){["#dz","#fz"].forEach(function(q){var z=$(q);if(z)z.classList.remove("on")})});
document.addEventListener("drop",function(ev){var z=ev.target.closest&&ev.target.closest("#dz,#fz");if(!z)return;ev.preventDefault();z.classList.remove("on");if(z.id==="fz")importFiles(Array.prototype.slice.call(ev.dataTransfer.files));else readFile(ev.dataTransfer.files[0])});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&S.dlg){S.queue=[];closeDlg()}});

async function saveSettings(){try{await Store.saveSettings(S.settings)}catch(x){toast("保存に失敗しました: "+(x.message||x.code))}}
async function reload(noRender){
 var d=await Store.load();S.orders=d.orders;S.mails=d.mails;S.settings=Object.assign({staff:[],own:[]},d.settings||{});
 if(!reload.busy&&S.mails&&S.mails.length){reload.busy=1;try{await autoLinkMails(true)}catch(x){}reload.busy=0}
 if(!noRender&&!S.dlg){if(S.tab==="import"){renderNav();renderLog()}else render()}
 else renderNav();
}

/* ================= 起動・ログイン ================= */
function loginUi(){
 return new Promise(function(resolve){
  var w=document.createElement("div");w.className="login";
  w.innerHTML='<form><img class="lg" src="'+LOGO+'" alt="Alpha Purchase"><h1>アルファ受注ナビ</h1><div class="sub">パスワードを入力してください</div><input type="password" id="lpw" autocomplete="current-password" autofocus><div class="sub" id="lerr" style="color:var(--bad);min-height:18px"></div><button class="btn pri" style="width:100%;padding:10px">ログイン</button></form>';
  document.body.appendChild(w);var inp=$("#lpw");setTimeout(function(){inp.focus()},50);
  $("form",w).onsubmit=async function(ev){ev.preventDefault();$("#lerr").textContent="";
   try{var r=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({op:"login",password:inp.value})});var j=await r.json();
    if(r.ok&&j.ok){w.remove();resolve(j)}else{$("#lerr").textContent="パスワードが違います";inp.select()}}catch(x){$("#lerr").textContent="通信に失敗しました"}};
 });
}
async function useCap(n){try{return window.claude&&window.claude.use?await window.claude.use(n):null}catch(x){return null}}
async function boot(){
 var info=null;
 if(window.claude&&window.claude.use){
  S.mode="loading";render();
  var caps=await Promise.all([useCap("db"),useCap("sample"),useCap("mcp"),useCap("downloads"),useCap("assets")]);
  CAP.db=caps[0];CAP.sample=caps[1];CAP.mcp=caps[2];CAP.downloads=caps[3];CAP.assets=caps[4];
  if(CAP.db){
   Store=Art;S.mode="artifact";S.flags={ai:!!CAP.sample,inbound:false};NAV=NAV.filter(function(n){return n[0]!=="import"});
   await Art.start(function(){if(!S.busy)reload()});
   await reload(true);render();gmAuto();setInterval(function(){if(!document.hidden)gmAuto()},300000);setInterval(drawGm,60000);return;
  }
 }
 if(location.protocol!=="file:"&&!(window.claude&&window.claude.use)){
  try{
   var r=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({op:"check"})});
   var j=await r.json();
   if(j&&j.nopw){S.nopw=true}
   else if(j&&j.ok)info=j;
   else if(j&&j.ok===false)info=await loginUi();
  }catch(x){info=null}
 }
 if(info){Store=Server;S.mode="server";S.flags={ai:!!info.ai,inbound:!!info.inbound};NAV=NAV.filter(function(n){return n[0]!=="import"});if(S.tab==="import")S.tab="home"}
 else{Store=Local;S.mode="local"}
 try{await reload(true)}catch(x){toast("データを読み込めませんでした: "+x.message)}
 render();
 if(S.nopw)toast("サーバーに APP_PASSWORD が設定されていないため、お試しモードで開きました");
 if(Store.mode==="server"){setInterval(function(){if(!document.hidden)checkNew()},20000);pollGm();setInterval(function(){if(!document.hidden)pollGm()},60000)}
}
boot();
})();
